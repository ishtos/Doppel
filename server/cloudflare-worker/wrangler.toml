name = "doppel-ai-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# This Worker needs two secrets. Set them with `wrangler secret put` — do NOT
# put them here (this file is committed):
#
#   wrangler secret put OPENAI_API_KEY   # the real OpenAI key (required)
#   wrangler secret put APP_TOKEN        # optional shared app token (recommended)
#
# No account IDs or secrets belong in this file.

# Optional rate limiting + daily cost cap. Create a KV namespace and uncomment
# the block below (the Worker guards on `env.RL`, so it deploys fine without it):
#   wrangler kv namespace create RL
# [[kv_namespaces]]
# binding = "RL"
# id = "<paste the id printed by the command above>"
