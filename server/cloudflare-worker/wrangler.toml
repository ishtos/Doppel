name = "doppel-ai-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Secrets (set with `wrangler secret put`, NOT committed):
#   OPENAI_API_KEY (required) · APP_TOKEN (recommended) · APPLE_SHARED_SECRET (IAP)
# Setup steps for the bindings below live in README.md.

# Rate limiting + daily cost cap (env.RL).
[[kv_namespaces]]
binding = "RL"
id = "570a22f7149946d08f0ae5e9da44815f"

# IAP entitlements store (env.DB). Apply schema.sql after `wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "doppel-iap"
database_id = "ccd23a12-04a6-4e61-a557-5069dbd0d52f"
