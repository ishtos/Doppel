name: doppel
description: AI Shadowing Coach - シャドーイングを加速するAIコーチ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.3.0

  # Data Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local DB
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.1.0

  # Fonts
  google_fonts: ^6.2.1

  # Audio
  just_audio: ^0.9.40
  record: ^6.2.0
  flutter_tts: ^4.2.0

  # AI / Speech
  http: ^1.2.2

  # Charts
  fl_chart: ^0.69.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0

  # Utilities
  path_provider: ^2.1.4
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.12
  hive_ce_generator: ^1.6.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1A237E"
  color_dark: "#121212"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo_dark.png
  android_12:
    color: "#1A237E"
    color_dark: "#121212"
    image: assets/splash/splash_logo.png
    image_dark: assets/splash/splash_logo_dark.png
    icon_background_color: "#1A237E"
    icon_background_color_dark: "#121212"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/
