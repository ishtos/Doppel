name: Deploy iOS (TestFlight)

# main への push(=PRマージ) / `vX.Y.Z` タグ / 手動実行で TestFlight へ配信する。
# ビルド番号は github.run_number で自動採番するので、マージのたびに新ビルドになる。
on:
  push:
    branches:
      - main
    # ドキュメント/README のみの変更ではデプロイしない（コスト削減）
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
    tags:
      - 'v*'
  workflow_dispatch:

# 新しいデプロイが始まったら、進行中/待機中の古いデプロイをキャンセルして最新を優先する。
# （連続マージ時に古い中間ビルドを配信せず、最新の main だけを配信）
concurrency:
  group: deploy-ios
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Build & upload to TestFlight
    # Xcode 26 / iOS 26 SDK が必要（App Store Connect が iOS 18.5 SDK ビルドを拒否するため）
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Install dependencies
        run: flutter pub get

      # *.g.dart / *.freezed.dart は .gitignore 済みのため生成が必須
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # CIゲート: analyze/test が失敗したら配信せずここで停止する
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/dist.mobileprovision"

      # Dart のコンパイルと CocoaPods 準備（署名は次段の fastlane で行う）
      # ビルド番号を run_number で自動採番（単調増加）。同番号は TestFlight が拒否する。
      # バージョン名は pubspec.yaml の version を使用。
      # AIバックエンドはプロキシ経由（server/cloudflare-worker）。OpenAIキーはWorker側に
      # 保管し、アプリバイナリには埋め込まない（抽出リスク回避 / S1）。
      # AI_PROXY_URL 未設定なら、アプリは自動的に非AI（シミュレート採点＋定型文）に
      # フォールバックする。AI_PROXY_TOKEN は Worker の open-relay 防止用の共有トークン。
      - name: Pre-build (compile Dart, prepare Pods)
        run: >-
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}
          --dart-define=AI_PROXY_TOKEN=${{ secrets.AI_PROXY_TOKEN }}

      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          APP_IDENTIFIER: com.ishtos.doppel
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane beta
